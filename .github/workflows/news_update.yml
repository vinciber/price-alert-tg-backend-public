
name: Update News Feed

on:
  schedule:
    - cron: '*/30 * * * *' # Every 30 minutes
  workflow_dispatch: # Allow manual trigger

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Private Backend
        uses: actions/checkout@v4
        with:
          repository: vinciber/price-alert-tg-backend
          token: ${{ secrets.PRIVATE_REPO_PAT }}
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install feedparser beautifulsoup4 python-dateutil requests lxml supabase

      - name: Run News Scraper
        env:
          PYTHONPATH: ${{ github.workspace }}
          MICROSERVICE_SECRET_KEY: ${{ secrets.MICROSERVICE_SECRET_KEY }}
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python execution/scrapers/news_collector.py

      - name: Commit and Push JSON to Private Repo
        run: |
          git config --global user.name 'vinciber'
          git config --global user.email 'vinciberlr@gmail.com'
          git diff --quiet && git diff --staged --quiet || (
            git add public/data/news_feed_*.json
            git commit -m "Update news feed (v2)"
            git pull --rebase origin main
            git push https://${{ secrets.PRIVATE_REPO_PAT }}@github.com/vinciber/price-alert-tg-backend.git HEAD:main
          )
