name: Mega Signal Analysis

on:
  schedule:
    # Esecuzione ogni ora al minuto 27 per evitare la congestione di inizio ora di GitHub Actions
    - cron: '27 * * * *'
  workflow_dispatch:

jobs:
  mega-signal-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Private Backend
        uses: actions/checkout@v4
        with:
          repository: vinciber/price-alert-tg-backend
          token: ${{ secrets.PRIVATE_REPO_PAT }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements-worker.txt ]; then
            pip install -r requirements-worker.txt
          elif [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          # Ensure critical packages are available
          pip install requests websocket-client

      - name: Diagnose env (boolean only — no values)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          MEGA_SIGNAL_SERVICE_SECRET: ${{ secrets.MEGA_SIGNAL_SERVICE_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          KV_REST_API_URL: ${{ secrets.KV_REST_API_URL }}
        run: |
          python3 -c "
          import os
          print('SUPABASE_URL present:', bool(os.environ.get('SUPABASE_URL')))
          print('SUPABASE_KEY present:', bool(os.environ.get('SUPABASE_KEY')))
          print('BACKEND_URL present:', bool(os.environ.get('BACKEND_URL')))
          print('MEGA_SIGNAL_SERVICE_SECRET present:', bool(os.environ.get('MEGA_SIGNAL_SERVICE_SECRET')))
          print('TELEGRAM_BOT_TOKEN present:', bool(os.environ.get('TELEGRAM_BOT_TOKEN')))
          print('KV_REST_API_URL present:', bool(os.environ.get('KV_REST_API_URL')))
          "

      - name: Validate Mega Signal service secret
        env:
          MEGA_SIGNAL_SERVICE_SECRET: ${{ secrets.MEGA_SIGNAL_SERVICE_SECRET }}
        run: |
          python3 -c "
          import os, sys
          if not os.environ.get('MEGA_SIGNAL_SERVICE_SECRET', '').strip():
              print('::error::MEGA_SIGNAL_SERVICE_SECRET is not configured')
              sys.exit(1)
          print('MEGA_SIGNAL_SERVICE_SECRET validated')
          "

      - name: Run Mega Signal Script
        env:
          # Vercel KV Secrets
          KV_REST_API_URL: ${{ secrets.KV_REST_API_URL }}
          KV_REST_API_TOKEN: ${{ secrets.KV_REST_API_TOKEN }}

          # API Secrets
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          MEGA_SIGNAL_SERVICE_SECRET: ${{ secrets.MEGA_SIGNAL_SERVICE_SECRET }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}

          # Microservices
          PANDAS_SERVICE_URL: ${{ secrets.PANDAS_SERVICE_URL }}
          MICROSERVICE_SECRET_KEY: ${{ secrets.MICROSERVICE_SECRET_KEY }}

          # Database (Supabase)
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

          # Backend Proxy (Fase 2.6)
          BACKEND_URL: ${{ secrets.BACKEND_URL }}

          # Other
          LOG_LEVEL: INFO
          PROXY_URL: ${{ secrets.PROXY_URL }}

        run: |
          echo "🚀 Starting Mega Signal Analysis..."
          python execution/scripts/run_mega_signal.py
          echo "✅ Analysis Complete"
