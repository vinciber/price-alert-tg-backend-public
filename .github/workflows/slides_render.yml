name: Render Social Slides

# Rende i caroselli Instagram delle bozze a 5 stelle.
#
# Perché qui e non su Railway: il render vuole Chrome, e il container del
# backend non ne ha uno (nixpacks installa solo python e node). Aggiungerlo
# significherebbe ~300 MB in più su un servizio always-on, per un lavoro che
# gira poche volte al giorno. I runner Actions il browser ce l'hanno già —
# stesso motivo per cui daily_etf_scrape.yml usa setup-chrome.
#
# Il backend, quando spedisce una bozza, propone l'evento come CANDIDATO nel
# pool KV (SOCIAL_POOL). Non pubblica: a decidere è il palinsesto
# (utils/social_planner.py), due slot al giorno — il primo il carosello
# tecnico, il secondo il "come si attiva" dello stesso alert.
#
# Questo workflow chiede al palinsesto se c'è uno slot aperto: se sì genera
# QUEL deck e lo manda in album sul bot delle bozze con le didascalie pronte
# da copiare. Fuori dagli slot esce senza fare nulla.

on:
  schedule:
    # Ogni 30 minuti: non è la cadenza di pubblicazione (quella la decidono gli
    # slot) ma la frequenza con cui si controlla se uno slot è aperto. La
    # finestra di uno slot è più larga, quindi un run fallito si recupera al
    # giro dopo.
    - cron: '*/30 * * * *'
  workflow_dispatch: # generazione a mano quando serve subito

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Private Backend
        uses: actions/checkout@v4
        with:
          repository: vinciber/price-alert-tg-backend
          token: ${{ secrets.PRIVATE_REPO_PAT }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      # Il generatore usa solo la stdlib; requests serve unicamente per
      # l'invio dell'album a Telegram.
      - name: Install dependencies
        run: pip install requests

      - name: Render and send the scheduled deck
        env:
          KV_REST_API_URL: ${{ secrets.KV_REST_API_URL }}
          KV_REST_API_TOKEN: ${{ secrets.KV_REST_API_TOKEN }}
          X_DRAFT_TELEGRAM_BOT_TOKEN: ${{ secrets.X_DRAFT_TELEGRAM_BOT_TOKEN }}
          X_DRAFT_TELEGRAM_CHAT_ID: ${{ secrets.X_DRAFT_TELEGRAM_CHAT_ID }}
          # Orari degli slot (UTC) e ampiezza della finestra: si tarano da qui
          # senza toccare il codice. Vuoti = 11:00 e 17:30 UTC.
          SOCIAL_SLOTS_UTC: ${{ vars.SOCIAL_SLOTS_UTC }}
          SOCIAL_SLOT_WINDOW_MIN: ${{ vars.SOCIAL_SLOT_WINDOW_MIN }}
        run: python3 tools/slides/generate_deck.py --plan --send

      # Le slide restano scaricabili per una settimana: se una viene male, si
      # guarda il PNG senza doverla rigenerare.
      - name: Upload slides
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: slides
          path: temp/slides_out/**
          if-no-files-found: ignore
          retention-days: 7
