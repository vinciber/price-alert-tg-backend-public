name: DeFi Swap Refresh

on:
  schedule:
    # Daily refresh of the informational DeFi pool snapshot, at 04:30 UTC.
    - cron: '30 4 * * *'
  workflow_dispatch:

# A delayed GitHub run must not overlap a manual retry. The Upstash NX lock in
# the private job remains the fail-closed guard across all invocations.
concurrency:
  group: defi-swap-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Private Backend
        uses: actions/checkout@v4
        with:
          repository: vinciber/price-alert-tg-backend
          ref: main
          token: ${{ secrets.PRIVATE_REPO_PAT }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: python -m pip install 'httpx>=0.27.0' 'supabase>=2.3.4'

      - name: Refresh DeFi Swap Opportunities
        env:
          KV_REST_API_URL: ${{ secrets.KV_REST_API_URL }}
          KV_REST_API_TOKEN: ${{ secrets.KV_REST_API_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python -m utils.defi_swap_job
